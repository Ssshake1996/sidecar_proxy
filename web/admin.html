<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Audit</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    header { padding: 18px 24px; background: #17202a; color: #fff; }
    main { max-width: 1280px; margin: 0 auto; padding: 20px; }
    .toolbar, .detail { background: #fff; border: 1px solid #d9dee5; padding: 16px; margin-bottom: 16px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 2fr 1fr auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 5px; font-size: 12px; color: #53606d; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { border: 1px solid #b8c1cc; padding: 8px; border-radius: 4px; background: #fff; }
    button { border: 0; border-radius: 4px; padding: 9px 14px; background: #1769aa; color: #fff; cursor: pointer; }
    button.secondary { background: #53606d; }
    button:disabled { opacity: .55; cursor: default; }
    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #d9dee5; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { text-align: left; border-bottom: 1px solid #e8ebef; padding: 10px; vertical-align: top; }
    th { background: #eef1f4; font-size: 12px; color: #53606d; }
    tr[data-id] { cursor: pointer; }
    tr[data-id]:hover { background: #f7fafc; }
    .muted { color: #667482; font-size: 12px; }
    .prompt { white-space: pre-wrap; max-width: 560px; word-break: break-word; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .detail-grid strong { display: block; margin-top: 3px; word-break: break-word; }
    .review { display: grid; grid-template-columns: 180px 180px 1fr auto; gap: 10px; align-items: end; margin-top: 16px; }
    #message { min-height: 20px; margin: 10px 0; color: #8a2e2e; }
    @media (max-width: 900px) {
      .toolbar, .detail-grid, .review { grid-template-columns: 1fr; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>
  <header><strong>Prompt Audit</strong></header>
  <main>
    <section class="toolbar" aria-label="Filters">
      <label>Admin token<input id="token" type="password" autocomplete="off"></label>
      <label>User ID<input id="user" inputmode="numeric" placeholder="optional"></label>
      <label>Search prompt or user<input id="query" placeholder="optional"></label>
      <label>Limit<select id="limit"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label>
      <button id="load">Load</button>
    </section>
    <div id="message" role="status"></div>
    <section class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>User</th><th>Model</th><th>Endpoint</th><th>Prompt</th><th>Review</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Enter the admin token and load records.</td></tr></tbody>
      </table>
    </section>
    <section id="detail" class="detail" hidden>
      <div class="detail-grid">
        <div><span class="muted">Record</span><strong id="d-id"></strong></div>
        <div><span class="muted">Request ID</span><strong id="d-request"></strong></div>
        <div><span class="muted">Received</span><strong id="d-time"></strong></div>
        <div><span class="muted">User</span><strong id="d-user"></strong></div>
        <div><span class="muted">Protocol / model</span><strong id="d-model"></strong></div>
        <div><span class="muted">Excluded roles</span><strong id="d-excluded"></strong></div>
      </div>
      <p class="muted">User messages</p>
      <textarea id="d-prompt" rows="10" readonly></textarea>
      <div class="review">
        <label>Status<select id="review-status"><option>pending</option><option>approved</option><option>flagged</option><option>ignored</option></select></label>
        <label>Reviewer<input id="reviewer"></label>
        <label>Note<input id="review-note"></label>
        <button id="save-review">Save review</button>
      </div>
    </section>
  </main>
  <script>
    let selectedId = "";
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const headers = () => ({"Authorization": "Bearer " + $("token").value.trim()});
    const setMessage = (value) => { $("message").textContent = value || ""; };
    async function loadRecords() {
      setMessage("");
      const params = new URLSearchParams({limit: $("limit").value});
      if ($("user").value.trim()) params.set("user_id", $("user").value.trim());
      if ($("query").value.trim()) params.set("q", $("query").value.trim());
      const response = await fetch("/admin/records?" + params, {headers: headers()});
      if (!response.ok) throw new Error("request failed: " + response.status);
      const data = await response.json();
      $("rows").innerHTML = data.items.length ? data.items.map((item) => `
        <tr data-id="${esc(item.id)}">
          <td>${esc(new Date(item.received_at).toLocaleString())}</td>
          <td>${esc(item.username || item.email || item.user_id || "unknown")}</td>
          <td>${esc(item.model)}</td>
          <td>${esc(item.endpoint)}</td>
          <td class="prompt">${esc(item.prompt_text)}</td>
          <td>${esc(item.review_status)}</td>
        </tr>`).join("") : '<tr><td colspan="6" class="muted">No records.</td></tr>';
      document.querySelectorAll("tr[data-id]").forEach((row) => row.addEventListener("click", () => showDetail(row.dataset.id)));
    }
    async function showDetail(id) {
      setMessage("");
      const response = await fetch("/admin/records/" + encodeURIComponent(id), {headers: headers()});
      if (!response.ok) throw new Error("detail request failed: " + response.status);
      const item = await response.json();
      selectedId = item.id;
      $("detail").hidden = false;
      $("d-id").textContent = item.id;
      $("d-request").textContent = item.request_id;
      $("d-time").textContent = new Date(item.received_at).toLocaleString();
      $("d-user").textContent = item.username || item.email || item.user_id || "unknown";
      $("d-model").textContent = [item.protocol, item.model].filter(Boolean).join(" / ");
      $("d-excluded").textContent = JSON.stringify(item.excluded_role_counts || {});
      $("d-prompt").value = item.prompt_text || "";
      $("review-status").value = item.review_status || "pending";
      $("reviewer").value = item.reviewer || "";
      $("review-note").value = item.review_note || "";
    }
    async function saveReview() {
      if (!selectedId) return;
      const response = await fetch("/admin/records/" + encodeURIComponent(selectedId), {
        method: "PATCH", headers: {...headers(), "Content-Type": "application/json"},
        body: JSON.stringify({review_status: $("review-status").value, reviewer: $("reviewer").value, review_note: $("review-note").value})
      });
      if (!response.ok) throw new Error("save failed: " + response.status);
      await loadRecords();
      await showDetail(selectedId);
    }
    $("load").addEventListener("click", () => loadRecords().catch((error) => setMessage(error.message)));
    $("save-review").addEventListener("click", () => saveReview().catch((error) => setMessage(error.message)));
  </script>
</body>
</html>
